
name: Build Nova PC for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nova_pc_electron_v0_5_sin_node_local (2)/nova_pc_electron
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit

      - name: Build installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Nova-PC-Windows-x64
          path: nova_pc_electron_v0_5_sin_node_local (2)/nova_pc_electron/dist/*.exe
          if-no-files-found: error
